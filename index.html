<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Software Testing Laboratory - Registration</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif;}
body{background:#f0f4f8;display:flex;justify-content:center;align-items:center;min-height:100vh;}
.container{width:700px;background:white;padding:30px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,0.25);}
h1{color:#003366;text-align:center;margin-bottom:10px;}
h2{color:#444;text-align:center;margin-bottom:30px;}
table{width:100%;border-collapse:collapse;}
td{padding:12px;}
td:first-child{width:35%;font-weight:bold;color:#222;}
input[type=text],input[type=password],input[type=email],input[type=date],select{width:100%;padding:10px;border:1px solid #999;border-radius:6px;font-size:15px;}
input:focus,select:focus{border:2px solid royalblue;outline:none;}
input[type=radio]{margin-right:5px;}
label{margin-right:20px;}
.captcha{background:#003366;color:white;padding:10px 25px;border-radius:6px;font-weight:bold;letter-spacing:3px;font-size:18px;}
button{width:160px;padding:12px;border:none;border-radius:6px;font-size:16px;cursor:pointer;margin:10px;}
#register{background:#28a745;color:white;}
#register:hover{background:#218838;}
button[type=reset]{background:#dc3545;color:white;}
button[type=reset]:hover{background:#b21f2d;}
.footer{margin-top:20px;text-align:center;color:gray;font-size:14px;}
#message{margin-top:20px;padding:15px;border-radius:6px;display:none;font-weight:bold;text-align:center;}
.success{background:#d4edda;color:#155724;border:1px solid #28a745;}
.error{background:#f8d7da;color:#721c24;border:1px solid #dc3545;}
/* small-screen fix */
body{padding:16px;}
.container{max-width:100%;}
@media(max-width:600px){td{display:block;width:100%!important;padding:6px 0;}button{width:44%;margin:10px 2%;}}
</style>
</head>
<body>
<div class="container">
  <h1>Software Testing Laboratory</h1>
  <h2>Registration Page</h2>
  <table>
    <tr><td>Full Name</td><td><input type="text" id="name" placeholder="Enter full name"></td></tr>
    <tr><td>Email</td><td><input type="email" id="email" placeholder="Enter email"></td></tr>
    <tr><td>Username</td><td><input type="text" id="username" placeholder="Choose username"></td></tr>
    <tr><td>Password</td><td><input type="password" id="password" placeholder="Min 6 characters"></td></tr>
    <tr><td>Confirm Password</td><td><input type="password" id="confirm" placeholder="Re-enter password"></td></tr>
    <tr><td>Date of Birth</td><td><input type="date" id="dob"></td></tr>
    <tr><td>Gender</td><td>
      <label><input type="radio" name="gender" value="Male">Male</label>
      <label><input type="radio" name="gender" value="Female">Female</label>
      <label><input type="radio" name="gender" value="Other">Other</label></td></tr>
    <tr><td>Course</td><td><select id="course">
      <option value="">-- Select --</option><option>B.Tech CSE</option><option>B.Tech IT</option><option>MCA</option><option>M.Tech</option></select></td></tr>
    <tr><td>Captcha</td><td><span class="captcha" id="captchaText"></span></td></tr>
    <tr><td>Enter Captcha</td><td><input type="text" id="captchaInput" placeholder="Type captcha"></td></tr>
    <tr><td colspan="2" style="text-align:center">
      <button type="button" id="register">Register</button>
      <button type="reset" id="resetBtn">Reset</button></td></tr>
  </table>
  <div id="message"></div>
  <div class="footer">&copy; Software Testing Laboratory</div>
</div>
<script>
let cap='';
function newCaptcha(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';cap='';for(let i=0;i<5;i++)cap+=c[Math.floor(Math.random()*c.length)];document.getElementById('captchaText').textContent=cap;}
function show(t,ok){const m=document.getElementById('message');m.style.display='block';m.className=ok?'success':'error';m.textContent=t;}
const $=id=>document.getElementById(id).value.trim();
document.getElementById('register').onclick=()=>{
  if(!$('name')||!$('email')||!$('username')||!$('password')||!$('confirm')||!$('dob')||!$('course')||!document.querySelector('input[name=gender]:checked'))return show('Please fill all fields.',false);
  if(!/^\S+@\S+\.\S+$/.test($('email')))return show('Invalid email address.',false);
  if($('password').length<6)return show('Password must be at least 6 characters.',false);
  if($('password')!==$('confirm'))return show('Passwords do not match.',false);
  if($('captchaInput')!==cap){newCaptcha();return show('Captcha incorrect. Try again.',false);}
  show('Registration successful! Welcome, '+$('name')+'.',true);
};
document.getElementById('resetBtn').onclick=()=>{document.getElementById('message').style.display='none';newCaptcha();};
newCaptcha();
</script>
</body>
</html>
